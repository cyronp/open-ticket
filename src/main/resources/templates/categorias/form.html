<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${id == null ? 'Nova categoria' : 'Editar categoria'}, 'categorias', ~{::conteudo})}">
<body>
<th:block th:fragment="conteudo">
    <a class="back-link" th:href="@{/app/categorias}">
        <svg th:replace="~{fragments/icons :: icon('arrow-left')}"></svg> Categorias
    </a>
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${id == null ? 'Nova categoria' : 'Editar categoria'}">Nova categoria</h1>
            <p class="page-description">O nome é único por categoria.</p>
        </div>
    </div>

    <form class="card" method="post" novalidate th:object="${form}"
          th:action="${id == null} ? @{/app/categorias} : @{/app/categorias/{id}(id=${id})}">
        <div class="card-content">
            <div class="alert alert-destructive" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <svg th:replace="~{fragments/icons :: icon('alert')}"></svg>
                <div><div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erro</div></div>
            </div>

            <div class="form-grid">
                <div class="field full" th:classappend="${#fields.hasErrors('nome')} ? 'has-error'">
                    <label class="label" for="nome">Nome</label>
                    <input class="input" type="text" th:field="*{nome}" maxlength="100" placeholder="Rede" autofocus>
                    <p class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
                </div>
                <div class="field full" th:classappend="${#fields.hasErrors('descricao')} ? 'has-error'">
                    <label class="label" for="descricao">Descrição <span class="optional">(opcional)</span></label>
                    <textarea class="textarea" th:field="*{descricao}" maxlength="255"
                              placeholder="Problemas de conexão, Wi-Fi, VPN..."></textarea>
                    <p class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></p>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <a class="btn btn-outline" th:href="@{/app/categorias}">Cancelar</a>
            <button type="submit" class="btn" th:text="${id == null ? 'Cadastrar categoria' : 'Salvar alterações'}">Salvar</button>
        </div>
    </form>
</th:block>
</body>
</html>
