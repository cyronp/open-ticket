<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Ícones do Lucide (mesma biblioteca usada pelo shadcn/ui) -->
<svg th:fragment="icon(nome)" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <th:block th:switch="${nome}">
        <th:block th:case="'dashboard'">
            <rect width="7" height="9" x="3" y="3" rx="1"/>
            <rect width="7" height="5" x="14" y="3" rx="1"/>
            <rect width="7" height="9" x="14" y="12" rx="1"/>
            <rect width="7" height="5" x="3" y="16" rx="1"/>
        </th:block>
        <th:block th:case="'ticket'">
            <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
            <path d="M13 5v2"/>
            <path d="M13 17v2"/>
            <path d="M13 11v2"/>
        </th:block>
        <th:block th:case="'users'">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </th:block>
        <th:block th:case="'wrench'">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </th:block>
        <th:block th:case="'tag'">
            <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
            <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
        </th:block>
        <th:block th:case="'plus'">
            <path d="M5 12h14"/>
            <path d="M12 5v14"/>
        </th:block>
        <th:block th:case="'pencil'">
            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
            <path d="m15 5 4 4"/>
        </th:block>
        <th:block th:case="'trash'">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </th:block>
        <th:block th:case="'arrow-left'">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
        </th:block>
        <th:block th:case="'arrow-right'">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
        </th:block>
        <th:block th:case="'chevron-left'">
            <path d="m15 18-6-6 6-6"/>
        </th:block>
        <th:block th:case="'chevron-right'">
            <path d="m9 18 6-6-6-6"/>
        </th:block>
        <th:block th:case="'message'">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </th:block>
        <th:block th:case="'alert'">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
        </th:block>
        <th:block th:case="'check'">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <path d="m9 11 3 3L22 4"/>
        </th:block>
        <th:block th:case="'lock'">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </th:block>
        <th:block th:case="'filter'">
            <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
        </th:block>
        <th:block th:case="'x'">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
        </th:block>
        <th:block th:case="'inbox'">
            <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
        </th:block>
    </th:block>
</svg>
</body>
</html>
